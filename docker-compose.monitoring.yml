services:
  prometheus:
    image: prom/prometheus:latest
    container_name: forum-prometheus
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=500MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: forum-grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: forum-cadvisor
    restart: unless-stopped
    mem_limit: 256m
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: forum-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - default
      - forum-network
    depends_on:
      - nginx

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: forum-mysqld-exporter
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.my-cnf=/etc/mysqld-exporter.cnf
    volumes:
      - ./monitoring/mysqld-exporter.cnf:/etc/mysqld-exporter.cnf:ro
    networks:
      - default
      - forum-network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  prometheus_data:
  grafana_data:
